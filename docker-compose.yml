services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: minadoor
      POSTGRES_PASSWORD: minadoor_secret
      POSTGRES_DB: minadoor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minadoor -d minadoor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://minadoor:minadoor_secret@db:5432/minadoor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production-minadoor-travel-db-2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: http://localhost,http://localhost:80
      TEMP_EXPORT_DIR: /tmp/exports
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - exports_tmp:/tmp/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "sleep 5 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - exports_tmp:/tmp/exports:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  exports_tmp:
