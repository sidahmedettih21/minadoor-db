# MinaDoor – production Nginx config
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS (enable when TLS is configured)
    # return 301 https://$host$request_uri;

    # ── Security Headers ─────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"                    always;
    add_header X-Content-Type-Options    "nosniff"                 always;
    add_header Referrer-Policy           "strict-origin"           always;
    add_header Permissions-Policy        "geolocation=(), camera=()" always;
    add_header X-XSS-Protection          "1; mode=block"           always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
        always;
    # Uncomment after enabling HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    # ── API Proxy ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Prevent upstream error details leaking
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /50x.json;
    }

    # Extra-tight rate limit on login
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass        http://api:8000/api/v1/auth/login;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass        http://api:8000/health;
        proxy_set_header  Host $host;
        access_log        off;
    }

    # ── Frontend Static Files ─────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Error pages ───────────────────────────────────────────────────
    location = /50x.json {
        internal;
        return 503 '{"detail":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
